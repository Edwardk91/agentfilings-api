[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentfilings-ingest"
version = "0.0.0"
description = "EDGAR sync + parsers for AgentFilings"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentfilings_ingest"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
