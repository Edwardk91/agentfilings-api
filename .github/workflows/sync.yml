name: EDGAR sync

# Keeps the corpus fresh. GitHub's scheduler drifts (5–30+ min is normal) and can skip
# runs entirely, so this job is idempotent: each ticker's rows are replaced in one
# transaction, meaning a missed or repeated run converges rather than corrupting data.
# Off-peak minutes are used because the top of the hour is the most contended slot.
#
# Private repo, so scheduled runs are not auto-disabled after 60 days of inactivity.

on:
  schedule:
    # 07:17 and 23:17 UTC — after the SEC's nightly index build, away from peak.
    - cron: "17 7,23 * * *"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to sync (blank = refresh everything tracked)"
        required: false
        default: ""

concurrency:
  # Never let two syncs write the corpus at once.
  group: edgar-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync EDGAR -> Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ingest package
        run: pip install -e apps/ingest

      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python -m agentfilings_ingest.sync --db --tickers "${{ github.event.inputs.tickers }}"
          else
            python -m agentfilings_ingest.sync --refresh-tracked
          fi

      - name: Report freshness
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], prepare_threshold=None) as c, c.cursor() as cur:
              cur.execute("select count(*), max(updated_at) from companies")
              n, last = cur.fetchone()
              cur.execute("select count(*) from filings")
              filings = cur.fetchone()[0]
          print(f"corpus: {n} companies, {filings} filings, last updated {last}")
          PY
